<!DOCTYPE html>
<html>

<head>

    <title>{{ product.name }}</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f3f3f3;
        }

        .navbar {
            background-color: #131921;
            color: white;
            padding: 18px 30px;
            font-size: 28px;
            font-weight: bold;
        }

        .container {
            width: 80%;
            margin: 40px auto;
            background-color: white;
            padding: 30px;
            display: flex;
            gap: 40px;
        }

        .product-image {
            width: 400px;
            height: 400px;
            object-fit: contain;
        }

        .details {
            flex: 1;
        }

        .price {
            font-size: 28px;
            font-weight: bold;
        }

        .button {
            display: inline-block;
            background-color: #ffd814;
            padding: 12px 25px;
            text-decoration: none;
            color: black;
            border-radius: 5px;
        }

    </style>

</head>


<body>

    <div class="navbar">
        Amazon
    </div>


    <div class="container">

        <div>

            {% if product.image %}

                <img
                    src="{{ product.image.url }}"
                    class="product-image"
                    alt="{{ product.name }}"
                >

            {% endif %}

        </div>


        <div class="details">

            <h1>{{ product.name }}</h1>

            <p>
                {{ product.description }}
            </p>

            <p class="price">
                ₹{{ product.price }}
            </p>

            <p>
                Category: {{ product.category }}
            </p>

            <p>
                Available Stock: {{ product.stock }}
            </p>

            <br>

            <a href="/" class="button">
                Back to Products
            </a>

        </div>

    </div>

</body>

</html>
