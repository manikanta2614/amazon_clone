<!DOCTYPE html>
<html>

<head>

    <title>Place Order</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f3f3f3;
        }

        .container {
            width: 500px;
            margin: 40px auto;
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.15);
        }

        h1 {
            text-align: center;
        }

        .product {
            background-color: #f7f7f7;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 5px;
        }

        form p {
            margin-bottom: 15px;
        }

        input,
        textarea {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #ffd814;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
        }

    </style>

</head>


<body>

    <div class="container">

        <h1>Place Your Order</h1>


        <div class="product">

            <h2>
                {{ product.name }}
            </h2>

            <p>
                Price: ₹{{ product.price }}
            </p>

            <p>
                Category: {{ product.category }}
            </p>

        </div>


        <form method="POST">

            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit">
                Place Order
            </button>

        </form>

    </div>

</body>

</html>
